name: MangaLens
options:
  bundleIdPrefix: com.julyanxu
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  MangaLens:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MangaLens
        excludes:
          - Info.plist
          - MangaLens.entitlements
    dependencies:
      - target: MangaLensSafari
        embed: true
        link: false
        codeSign: true
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julyanxu.MangaLens
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MangaLens/MangaLens.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: MangaLens/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Manga Lens
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      gatherCoverageData: false
  MangaLensSafari:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MangaLensSafari
        excludes:
          - Info.plist
          - MangaLensSafari.entitlements
      - path: MangaLens/SafariJob.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_ENTITLEMENTS: MangaLensSafari/MangaLensSafari.entitlements
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: MangaLensSafari/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Manga Lens
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.julyanxu.MangaLens.SafariExtension
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
